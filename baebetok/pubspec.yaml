name: baebetok
description: A short-form video application built with Flutter named Baebetok - Featuring mood-based feeds, interactive polls, and ghost mode.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Video player
  video_player: ^2.8.0
  chewie: ^1.7.0
  
  # State management
  provider: ^6.1.0
  
  # UI components
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.3.0
  
  # Networking (for future API integration)
  http: ^1.1.0
  
  # Cached network images
  cached_network_image: ^3.3.0
  
  # Haptic feedback
  vibration: ^1.8.4
  
  # Share functionality
  share_plus: ^7.2.1
  
  # Local storage for history
  shared_preferences: ^2.2.2
  
  # Premium UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
